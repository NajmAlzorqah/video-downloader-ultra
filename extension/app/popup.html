<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">

    <header class="topbar">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true">&#xF0DEA;</span>
        <span class="brand-word">
          <span class="brand-name">Video Downloader Ultra</span>
          <span class="brand-sub">yt-dlp host</span>
        </span>
      </div>
      <div class="hright">
        <span id="themeName" class="theme-name" role="status"></span>
        <span class="hchip"><span id="hostDot" class="dot off" title="host status"></span></span>
      </div>
    </header>

    <section class="panel" id="probePanel">
      <h2 class="section-title">Video</h2>
      <div class="url-field">
        <input id="url" type="text" placeholder="Paste a video URL&#x2026;" spellcheck="false" autocomplete="off">
        <button id="probeBtn" class="btn ghost">Detect</button>
      </div>
      <p id="probeHint" class="probe-hint">Open a video page first, or paste a link. The active tab URL fills in automatically.</p>
      <div id="probeArea" hidden>
        <div id="meta" class="meta"></div>
        <div id="sizeRow" class="muted" hidden>Estimated size: <b id="sizeEst"></b></div>
        <div id="probeErr" class="err" hidden></div>
      </div>
    </section>

    <section id="opts" class="panel" hidden>
      <h2 class="section-title">Options</h2>

      <div class="field-block">
        <label class="field-label" for="formatSelect">Video quality</label>
        <select id="formatSelect" disabled></select>
        <div id="formatHint" class="muted" hidden></div>
      </div>

      <div class="field-block">
        <label class="check"><input type="checkbox" id="subsOn"> Download subtitles</label>
        <div id="subHint" class="muted" hidden></div>
        <div id="subsOpts" class="subs-options" hidden>
          <label class="check sub"><input type="checkbox" id="autoSubs"> Auto-generated captions</label>
          <div class="grid2">
            <div class="field-block">
              <label class="field-label" for="langs">Languages offered</label>
              <select id="langs"></select>
            </div>
            <div class="field-block">
              <label class="field-label" for="subFormat">Format</label>
              <select id="subFormat" disabled></select>
            </div>
          </div>
          <label class="check sub"><input type="checkbox" id="convertSrt"> Convert to SRT</label>
          <label class="check sub"><input type="checkbox" id="embed"> Embed into video</label>
        </div>
      </div>

      <!-- Playlist-only: a plain video URL has no playlist to download, so
           renderProbe()/updatePlaylistControl() unhides this wrapper only when
           the probe says the link is a playlist. -->
      <div id="playlistWrap" class="field-block" hidden>
        <label class="check"><input type="checkbox" id="playlist"> Download entire playlist</label>
      </div>

      <div id="chaptersWrap" class="field-block" hidden>
        <label class="field-label" for="chapters">Video sections (chapters)</label>
        <select id="chapters" disabled>
          <option value="off">Don't store sections</option>
          <option value="embed">Embed as chapter markers</option>
          <option value="split">Split into separate files</option>
        </select>
        <div id="chaptersHint" class="muted" hidden></div>
      </div>

      <div class="field-block save-to">
        <label class="field-label" for="outDir">Save to</label>
        <span id="outDir" class="mono"></span>
      </div>

      <button id="downloadBtn" class="btn primary" disabled>Download</button>

      <div id="progress" class="progress" hidden>
        <!-- Which video the bar below belongs to (host-echoed selection.title):
             without it a queue that promotes the next job shows a bar with no
             way to tell whose progress it is. -->
        <div id="progressTitle" class="progress-title" hidden></div>
        <div class="progress-row">
          <div class="bar"><div id="barFill"></div></div>
          <div id="pct" class="mono pct"></div>
        </div>
        <div class="progress-stats">
          <div id="dlSize"></div>
          <div id="speed"></div>
        </div>
      </div>

      <!-- Pause/Resume + Cancel act on the job in the bar directly above, so
           they sit *under* it: the Download button stays at the top because it
           starts a new job (queues one while this one runs). -->
      <div id="actionsRow" class="actions-row" hidden>
        <button id="pauseBtn" class="btn" hidden>Pause</button>
        <button id="cancelBtn" class="btn danger" hidden>Cancel</button>
      </div>
      <div id="msg" class="status-line"></div>
      <div id="warn" class="warn" hidden></div>
    </section>

    <section id="queueSection" class="panel" hidden>
      <h2 class="section-title">Queue</h2>
      <ul id="queueList"></ul>
    </section>

    <footer>
      <a id="optsLink" class="opts-link" href="#">Options <span class="chev" aria-hidden="true">&#x203A;</span></a>
    </footer>
  </div>

  <script src="theme.js"></script>
  <script src="controls.js"></script>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
