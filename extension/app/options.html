<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video Downloader Ultra - Options</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="card">

    <header class="topbar">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true">&#xF0DEA;</span>
        <span class="brand-word">
          <span class="brand-name">Video Downloader Ultra</span>
          <span class="brand-sub">options</span>
        </span>
      </div>
      <span id="themeName" class="theme-name" role="status"></span>
    </header>

    <section class="panel">
      <h2 class="section-title">Defaults</h2>

      <div class="field-block">
        <label class="field-label" for="outDir">Save downloads to</label>
        <input type="text" id="outDir" placeholder="~/Videos">
      </div>

      <div class="field-block">
        <label class="check"><input type="checkbox" id="playlist"> Download playlists by default</label>
      </div>

      <div class="field-block">
        <label class="field-label" for="chapters">Video sections (chapters)</label>
        <select id="chapters">
          <option value="off">Don't store sections</option>
          <option value="embed">Embed as chapter markers</option>
          <option value="split">Split into separate files</option>
        </select>
      </div>
    </section>

    <section class="panel">
      <h2 class="section-title">Subtitles</h2>

      <div class="field-block">
        <label class="check"><input type="checkbox" id="subsOn"> Download subtitles by default</label>
        <!-- Gated on the toggle above: with subtitles off there is nothing to
             auto-generate, convert or embed, so the whole block stays hidden
             (options.js's updateSubsVisibility keeps this in sync). -->
        <div id="subsOpts" class="subs-options" hidden>
          <label class="check sub"><input type="checkbox" id="auto"> Include auto-generated captions</label>
          <div class="sub-field">
            <label class="field-label" for="langs">Default languages (comma-separated, e.g. en,ar)</label>
            <input type="text" id="langs" placeholder="en">
          </div>
          <label class="check"><input type="checkbox" id="convertSrt"> Convert subtitles to SRT</label>
          <label class="check"><input type="checkbox" id="embed"> Embed subtitles into the video file</label>
        </div>
      </div>
    </section>

    <footer class="options-footer">
      <div class="status" id="hostStatus"></div>
      <div class="actions">
        <span id="saved"></span>
        <button id="reset" class="btn">Reset to defaults</button>
        <button id="save" class="btn primary">Save</button>
      </div>
    </footer>
  </div>

  <script src="theme.js"></script>
  <script src="controls.js"></script>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
